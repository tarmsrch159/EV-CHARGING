server {
    listen 443;
    server_name spd-demo.dtc.co.th;

    ssl_certificate /etc/letsencrypt/live/spd-demo.dtc.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spd-demo.dtc.co.th/privkey.pem;


    # -----------------------------------------------
    # เพิ่มบล็อกนี้ สำหรับส่งต่อให้ Backend
    # -----------------------------------------------
    location /api-tms-v2/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}